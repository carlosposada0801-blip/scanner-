<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3133b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phleb Practice">
<title>Phlebotomy Practice</title>
<style>
  :root{
    --bg:#f6f4f2; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e2de;
    --brand:#b3133b; --brand2:#e2486a; --ok:#1d8a4a; --bad:#c62828; --warn:#b26a00;
    --radius:16px; --shadow:0 2px 10px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141416; --card:#1f1f23; --ink:#f2f2f4; --muted:#a0a0a8; --line:#2e2e34; --shadow:none; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0;flex:1}
  header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:15px}
  main{padding:16px 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
  nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button .i{font-size:21px;line-height:1}
  nav button.on{color:var(--brand);font-weight:600}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px;text-align:left;
    color:var(--ink);font-size:15px;font-weight:600;box-shadow:var(--shadow);min-height:96px;display:flex;flex-direction:column;gap:6px}
  .tile .e{font-size:26px}
  .tile small{font-weight:400;color:var(--muted);font-size:12.5px}
  h2{font-size:21px;margin:4px 0 12px}
  h3{font-size:17px;margin:16px 0 8px}
  p{margin:6px 0}
  ul,ol{padding-left:22px;margin:6px 0}
  li{margin:4px 0}
  .muted{color:var(--muted)}
  .small{font-size:13.5px}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600}
  .btn.alt{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  .btn.full{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .back{background:none;border:0;color:var(--brand);font-size:16px;padding:0 0 10px;font-weight:600}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--line);font-size:12.5px;margin:2px 4px 2px 0}
  .tip{border-left:4px solid var(--brand);background:rgba(179,19,59,.07);padding:10px 12px;border-radius:8px;margin:10px 0}
  .warn{border-left:4px solid var(--warn);background:rgba(178,106,0,.09);padding:10px 12px;border-radius:8px;margin:10px 0}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:13px;color:var(--muted);font-weight:600}

  /* tubes */
  .tube{width:26px;height:64px;position:relative;flex:0 0 auto}
  .tube .cap{position:absolute;top:0;left:-2px;right:-2px;height:18px;border-radius:5px 5px 3px 3px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .tube .body{position:absolute;top:16px;left:3px;right:3px;bottom:0;border-radius:0 0 12px 12px;
    background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(230,230,235,.5));border:1px solid rgba(0,0,0,.15)}
  .tube .blood{position:absolute;left:4px;right:4px;bottom:1px;height:55%;border-radius:0 0 11px 11px;background:#8b0d1e;opacity:.85}
  .tube.big{width:40px;height:96px}
  .tube.big .cap{height:26px}.tube.big .body{top:24px}
  .tubeRow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .tubeRow:last-child{border-bottom:0}
  .tubeRow .n{font-size:22px;font-weight:800;color:var(--brand);width:26px;text-align:center}
  .tubeRow b{display:block}

  /* quiz */
  .opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);
    border-radius:12px;padding:13px 14px;margin:8px 0;font-size:16px}
  .opt.right{border-color:var(--ok);background:rgba(29,138,74,.12)}
  .opt.wrong{border-color:var(--bad);background:rgba(198,40,40,.10)}
  .opt:disabled{opacity:1}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
  .feedback{padding:12px;border-radius:12px;margin-top:6px;font-size:15px}
  .feedback.ok{background:rgba(29,138,74,.12)}
  .feedback.no{background:rgba(198,40,40,.10)}

  /* flashcards */
  .flash{perspective:1000px;height:300px;margin:8px 0 14px}
  .flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .flash.flip .in{transform:rotateY(180deg)}
  .flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:19px;overflow:auto}
  .flash .b{transform:rotateY(180deg);font-size:17px;background:linear-gradient(160deg,var(--card),rgba(179,19,59,.08))}
  .flash .lbl{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  /* order game */
  .bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:120px;padding:8px 0}
  .tbtn{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px 6px;width:78px;
    display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:600}
  .tbtn.used{opacity:.25;pointer-events:none}
  .tbtn.shake{animation:shake .35s;border-color:var(--bad)}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;border:2px dashed var(--line);border-radius:14px}
  .slot{width:40px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);text-align:center;line-height:1.1}
  .slot .tube{transform:scale(.75);margin:-8px 0}
  .ph{width:20px;height:48px;border:2px dashed var(--line);border-radius:4px 4px 10px 10px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
  .stepbtn{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin:7px 0;font-size:15px}
  .stepbtn.done{border-color:var(--ok);background:rgba(29,138,74,.1)}
  .stepbtn.shake{animation:shake .35s;border-color:var(--bad)}
  .stat{font-size:28px;font-weight:800;color:var(--brand)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px}
  .chip.on{border-color:var(--brand);background:var(--brand);color:#fff}
  details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
  summary{font-weight:600;cursor:pointer}
  .verse{font-style:italic;color:var(--muted);font-size:14px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1 id="title">🩸 Phlebotomy Practice</h1>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="home"><span class="i">🏠</span>Home</button>
  <button data-tab="learn"><span class="i">📖</span>Learn</button>
  <button data-tab="practice"><span class="i">🎯</span>Practice</button>
  <button data-tab="progress"><span class="i">📊</span>Progress</button>
</nav>

<script>
/* =========================================================
   DATA
   ========================================================= */
const TUBES = {
  culture:   {name:"Blood Culture (bottles / yellow SPS)", short:"Culture", cap:"linear-gradient(90deg,#f7e04b 50%,#6b4ea0 50%)",
              additive:"Broth (bottles) or SPS – sodium polyanethol sulfonate (yellow tube)", spec:"Whole blood", inv:"8–10",
              tests:["Blood cultures (sepsis, bacteremia)"], dept:"Microbiology", rank:1,
              notes:"Drawn FIRST to keep it sterile. Site cleaned with chlorhexidine (or per policy) and bottle tops wiped. With a butterfly, fill the AEROBIC bottle first (the air in the tubing goes into it). With a syringe, fill the ANAEROBIC bottle first. Follow your facility policy."},
  lightblue: {name:"Light Blue", short:"Lt Blue", cap:"#7ec8e3", additive:"Sodium citrate (3.2%) – binds calcium", spec:"Plasma", inv:"3–4",
              tests:["PT/INR","PTT / aPTT","D-dimer","Fibrinogen"], dept:"Coagulation", rank:2,
              notes:"Must be FILLED completely – 9:1 blood-to-additive ratio. Underfilled = rejected. If it's the first tube with a butterfly, draw a discard tube first."},
  red:       {name:"Red (plastic)", short:"Red", cap:"#c62828", additive:"Clot activator (plastic) / none (glass)", spec:"Serum", inv:"5 (plastic) / 0 (glass)",
              tests:["Chemistry","Serology","Drug levels","Blood bank (some facilities)"], dept:"Chemistry / Serology / Blood bank", rank:3,
              notes:"Let clot 30–60 minutes before centrifuging."},
  sst:       {name:"Gold / Red-Gray \"Tiger\" (SST)", short:"Gold SST", cap:"#f2b705", additive:"Clot activator + separator gel", spec:"Serum", inv:"5",
              tests:["CMP / BMP","Lipid panel","Liver panel","Thyroid (TSH)","Hormones"], dept:"Chemistry", rank:3,
              notes:"SST = Serum Separator Tube. Clot 30 min before spinning. Not for blood bank or some drug levels."},
  pst:       {name:"Light Green / Green-Gray (PST)", short:"Lt Green PST", cap:"#8fd18f", additive:"Lithium heparin + separator gel", spec:"Plasma", inv:"8–10",
              tests:["STAT chemistry","Electrolytes","Potassium"], dept:"Chemistry", rank:4,
              notes:"PST = Plasma Separator Tube. Heparin is an anticoagulant (inhibits thrombin)."},
  green:     {name:"Dark Green", short:"Green", cap:"#1b7f3b", additive:"Sodium or lithium heparin", spec:"Plasma / whole blood", inv:"8–10",
              tests:["Ammonia (on ice)","STAT chemistry","Chromosome studies (sodium heparin)"], dept:"Chemistry", rank:4,
              notes:"Do NOT use a lithium heparin tube for a lithium level, or sodium heparin for sodium."},
  lavender:  {name:"Lavender / Purple", short:"Lavender", cap:"#9b6fd1", additive:"EDTA (K2 or K3) – binds calcium", spec:"Whole blood", inv:"8–10",
              tests:["CBC","Hemoglobin A1c","ESR (sed rate)","Retic count","Blood smear"], dept:"Hematology", rank:5,
              notes:"EDTA preserves cell shape — that's why it's the hematology tube. EDTA carryover into other tubes raises potassium and lowers calcium, so it comes late."},
  pink:      {name:"Pink", short:"Pink", cap:"#f48fb1", additive:"K2 EDTA", spec:"Whole blood", inv:"8–10",
              tests:["Type & screen","Crossmatch","ABO/Rh"], dept:"Blood Bank", rank:5,
              notes:"Blood bank tubes need a special armband/label with patient's full info per facility policy."},
  royal:     {name:"Royal Blue", short:"Royal Blue", cap:"#1a3fa8", additive:"None, EDTA, or heparin (check label color)", spec:"Serum or whole blood", inv:"8–10 (additive)",
              tests:["Trace elements (zinc, copper)","Heavy metals","Toxicology"], dept:"Chemistry / Toxicology", rank:5,
              notes:"Made to be trace-element free. Label stripe tells the additive (red = none, lavender = EDTA, green = heparin)."},
  tan:       {name:"Tan", short:"Tan", cap:"#c9a46b", additive:"K2 EDTA (lead-free)", spec:"Whole blood", inv:"8–10",
              tests:["Blood lead level"], dept:"Chemistry / Toxicology", rank:5, notes:"Certified lead-free tube."},
  gray:      {name:"Gray", short:"Gray", cap:"#8a8f98", additive:"Sodium fluoride (stops glycolysis) + potassium oxalate (anticoagulant)", spec:"Plasma", inv:"8–10",
              tests:["Glucose (fasting, GTT)","Lactic acid / lactate (on ice)","Blood alcohol"], dept:"Chemistry", rank:6,
              notes:"Fluoride is an ANTIGLYCOLYTIC — it keeps cells from eating the glucose. Drawn LAST."}
};
const BASIC_ORDER = ["culture","lightblue","red","sst","green","lavender","gray"];
const FULL_ORDER  = ["culture","lightblue","red","sst","pst","green","lavender","pink","royal","tan","gray"];

const QUESTIONS = [
 // Order of draw
 {c:"Order of Draw",q:"Which tube/bottle is drawn FIRST in the venipuncture order of draw?",a:["Blood culture","Light blue","Red","Lavender"],e:"Blood cultures are first to keep the sample sterile and free of additive contamination."},
 {c:"Order of Draw",q:"Which tube is drawn LAST in the order of draw?",a:["Gray","Lavender","Green","Light blue"],e:"Gray (sodium fluoride / potassium oxalate) is last. Mnemonic: '...Green Light Go' – Gray goes last."},
 {c:"Order of Draw",q:"What is the correct order: culture, ___, red/gold, green, lavender, gray?",a:["Light blue","Pink","Royal blue","Tan"],e:"Light blue (citrate) comes right after cultures."},
 {c:"Order of Draw",q:"Why is the lavender (EDTA) tube drawn after the green and red tubes?",a:["EDTA carryover can falsely raise potassium and lower calcium","EDTA clots the blood","Lavender tubes are smaller","It is easier to label"],e:"K2/K3 EDTA contains potassium and binds calcium. Carryover into chemistry tubes gives falsely high K+ and low Ca²⁺."},
 {c:"Order of Draw",q:"Which mnemonic helps you remember the order of draw?",a:["Stop Light Red Stay Put, Green Light Go","ABC — Airway, Breathing, Circulation","RICE","FAST"],e:"Stop (sterile/cultures) Light (light blue) Red (red) Stay (SST) Put (PST) Green (green) Light (lavender) Go (gray)."},
 {c:"Order of Draw",q:"Which tube is drawn right before the gray tube?",a:["Lavender","Light blue","Red","Gold SST"],e:"Lavender (EDTA) → Gray is the end of the order."},
 {c:"Order of Draw",q:"Which organization sets the standard order of draw?",a:["CLSI","FDA","CDC","OSHA"],e:"CLSI (Clinical and Laboratory Standards Institute) publishes the order of draw (GP41)."},
 {c:"Order of Draw",q:"A patient needs a CBC, PT, and CMP. In what order do you draw?",a:["Light blue, Gold SST, Lavender","Lavender, Light blue, Gold SST","Gold SST, Lavender, Light blue","Light blue, Lavender, Gold SST"],e:"PT = light blue, CMP = gold/SST, CBC = lavender → light blue, gold, lavender."},
 {c:"Order of Draw",q:"Order for a glucose (gray), PTT (light blue), and potassium (green)?",a:["Light blue, Green, Gray","Gray, Green, Light blue","Green, Light blue, Gray","Light blue, Gray, Green"],e:"Light blue → Green → Gray."},
 {c:"Order of Draw",q:"In the CAPILLARY (skin puncture) order of draw, which comes first?",a:["EDTA (lavender)","Serum (red)","Heparin (green)","Gray"],e:"Capillary order is different: blood gases, then EDTA, then other additive tubes, then serum last. EDTA first because platelets clump quickly at the site."},
 // Tubes / additives
 {c:"Tubes & Additives",q:"What additive is in the light blue tube?",a:["Sodium citrate","EDTA","Sodium heparin","Sodium fluoride"],e:"Light blue = 3.2% sodium citrate, which binds calcium for coagulation testing."},
 {c:"Tubes & Additives",q:"What additive is in the lavender tube?",a:["EDTA","Sodium citrate","Lithium heparin","Potassium oxalate"],e:"Lavender = EDTA. It preserves cell shape for hematology."},
 {c:"Tubes & Additives",q:"What is the purpose of sodium fluoride in the gray tube?",a:["Antiglycolytic – preserves glucose","Activates clotting","Separates serum","Binds iron"],e:"Sodium fluoride stops cells from using up glucose (glycolysis)."},
 {c:"Tubes & Additives",q:"Heparin prevents clotting by:",a:["Inhibiting thrombin","Binding calcium","Removing fibrinogen","Activating platelets"],e:"Heparin is an antithrombin. EDTA, citrate and oxalate all work by binding calcium."},
 {c:"Tubes & Additives",q:"Which anticoagulants work by binding calcium?",a:["EDTA, sodium citrate, and potassium oxalate","Heparin only","Sodium fluoride only","Clot activator and gel"],e:"EDTA, citrate, oxalate = calcium binders. Heparin = inhibits thrombin."},
 {c:"Tubes & Additives",q:"The ratio of blood to additive in a light blue tube must be:",a:["9:1","1:1","4:1","1:9"],e:"9 parts blood to 1 part citrate. Underfilled tubes give falsely long clotting times and get rejected."},
 {c:"Tubes & Additives",q:"What does SST stand for?",a:["Serum Separator Tube","Sodium Saline Tube","Special Specimen Tube","Sterile Serum Tube"],e:"SST = Serum Separator Tube (gold or red/gray tiger top)."},
 {c:"Tubes & Additives",q:"What is in a PST (light green) tube?",a:["Lithium heparin and gel","EDTA and gel","Clot activator and gel","Sodium citrate"],e:"PST = Plasma Separator Tube: lithium heparin + separator gel."},
 {c:"Tubes & Additives",q:"Serum is obtained from a tube that:",a:["Is allowed to clot","Contains an anticoagulant","Contains EDTA","Is never centrifuged"],e:"Serum = clotted blood spun down (no fibrinogen). Plasma = anticoagulated blood spun down (contains fibrinogen)."},
 {c:"Tubes & Additives",q:"How long should an SST/red tube clot before centrifuging?",a:["30 minutes","2 minutes","2 hours","Spin immediately"],e:"About 30 minutes (up to 60) at room temp so it fully clots."},
 {c:"Tubes & Additives",q:"How many times do you invert a light blue tube?",a:["3–4","8–10","0","20"],e:"Light blue: 3–4 gentle inversions. Never shake – that causes hemolysis."},
 {c:"Tubes & Additives",q:"How many times do you invert a lavender tube?",a:["8–10","3–4","5","0"],e:"EDTA tubes: 8–10 gentle inversions."},
 {c:"Tubes & Additives",q:"How many times do you invert a gold SST tube?",a:["5","8–10","3–4","0"],e:"SST and plastic red (clot activator): 5 inversions."},
 {c:"Tubes & Additives",q:"Why do you never shake a tube?",a:["It causes hemolysis","It makes it clot faster","It cools the sample","It removes the vacuum"],e:"Shaking ruptures red cells (hemolysis). Invert gently."},
 // Tests
 {c:"Tests → Tubes",q:"A CBC is drawn in which tube?",a:["Lavender","Light blue","Gold SST","Gray"],e:"CBC = lavender (EDTA)."},
 {c:"Tests → Tubes",q:"PT/INR is drawn in which tube?",a:["Light blue","Lavender","Green","Gray"],e:"Coag tests (PT/INR, PTT, D-dimer, fibrinogen) = light blue."},
 {c:"Tests → Tubes",q:"A fasting glucose or glucose tolerance test is usually drawn in:",a:["Gray","Lavender","Light blue","Pink"],e:"Gray (sodium fluoride) preserves glucose."},
 {c:"Tests → Tubes",q:"Hemoglobin A1c is drawn in:",a:["Lavender","Gray","Gold SST","Light blue"],e:"HbA1c is measured on whole blood in an EDTA (lavender) tube."},
 {c:"Tests → Tubes",q:"A type and crossmatch is usually drawn in:",a:["Pink","Gray","Light blue","Light green"],e:"Pink (K2 EDTA) is the blood bank tube. Some facilities use lavender or red – follow policy."},
 {c:"Tests → Tubes",q:"A blood lead level is drawn in which tube?",a:["Tan","Gray","Light blue","Gold"],e:"Tan = lead-free K2 EDTA. Royal blue is also used for some metals."},
 {c:"Tests → Tubes",q:"A lipid panel or CMP is commonly drawn in:",a:["Gold SST","Lavender","Light blue","Gray"],e:"Chemistry panels = gold SST (or light green PST at many hospitals)."},
 {c:"Tests → Tubes",q:"An ESR (sed rate) uses which tube?",a:["Lavender","Gray","Red","Gold"],e:"ESR = lavender (EDTA) in most labs."},
 {c:"Tests → Tubes",q:"A D-dimer goes in which tube?",a:["Light blue","Lavender","Royal blue","Pink"],e:"D-dimer is a coagulation test → light blue."},
 {c:"Tests → Tubes",q:"Trace elements like zinc and copper are drawn in:",a:["Royal blue","Lavender","Light blue","Light green"],e:"Royal blue tubes are trace-element free."},
 {c:"Tests → Tubes",q:"A lithium level should NOT be drawn in which tube?",a:["Lithium heparin (green)","Gold SST","Red","It can be drawn in any"],e:"Lithium heparin would falsely raise the lithium result."},
 // Butterfly / needles
 {c:"Butterfly & Needles",q:"A larger gauge number means the needle is:",a:["Smaller (thinner)","Larger (wider)","Longer","Shorter"],e:"Gauge is backwards: 25g is thinner than 21g."},
 {c:"Butterfly & Needles",q:"Most common needle gauge for a routine adult venipuncture:",a:["21 gauge","16 gauge","25 gauge","27 gauge"],e:"21g is standard (22g is also common). 16g is for blood donation."},
 {c:"Butterfly & Needles",q:"Most common butterfly gauge?",a:["23 gauge","18 gauge","16 gauge","30 gauge"],e:"23g butterfly is the go-to. Range for phlebotomy is about 21–25g."},
 {c:"Butterfly & Needles",q:"When is a butterfly (winged infusion set) a good choice?",a:["Small, fragile, or hand veins; children; elderly patients","Every routine draw","Only for blood donation","Only arterial draws"],e:"Butterflies give more control on small, fragile, or hard-to-reach veins."},
 {c:"Butterfly & Needles",q:"Insertion angle for a butterfly needle:",a:["10–15 degrees","30–45 degrees","45–90 degrees","5 degrees"],e:"Butterfly: shallow angle, about 10–15°. Standard ETS needle: 15–30°."},
 {c:"Butterfly & Needles",q:"Insertion angle for a standard (ETS) needle:",a:["15–30 degrees","45 degrees","90 degrees","5 degrees"],e:"15–30°, bevel up."},
 {c:"Butterfly & Needles",q:"Needle bevel should face:",a:["Up","Down","Sideways","Doesn't matter"],e:"Bevel UP for a smooth entry with less pain."},
 {c:"Butterfly & Needles",q:"If you use a butterfly and the FIRST tube is a light blue, you should:",a:["Draw a discard tube first","Draw the light blue anyway","Skip the light blue","Draw lavender first"],e:"The butterfly tubing holds air (~0.5 mL dead space). A discard tube (non-additive or another light blue) fills the tubing so the light blue gets the correct 9:1 ratio."},
 {c:"Butterfly & Needles",q:"Why can drawing a large tube with a small butterfly (25g) cause problems?",a:["The strong vacuum through a tiny needle can hemolyze cells or collapse the vein","It clots faster","It's too slow to matter","It contaminates the sample"],e:"Use smaller-volume tubes with small-gauge needles to prevent hemolysis and vein collapse."},
 {c:"Butterfly & Needles",q:"What is the main safety risk of butterfly needles?",a:["Higher needlestick risk – the needle can bounce/recoil","They break easily","They can't hold tubes","They need larger tubes"],e:"Butterflies have a high needlestick rate. Activate the safety device right away and keep control of the tubing."},
 {c:"Butterfly & Needles",q:"ETS stands for:",a:["Evacuated Tube System","Emergency Transfer System","External Tube Syringe","Extra Tube Set"],e:"ETS = Evacuated Tube System (needle, holder, vacuum tubes)."},
 {c:"Butterfly & Needles",q:"When should the needle safety device be activated?",a:["Immediately after removing the needle from the arm","After labeling","At the end of the shift","Before the draw"],e:"Activate it right away, then put it in the sharps container. Never recap by hand."},
 {c:"Butterfly & Needles",q:"A syringe draw is helpful when:",a:["Veins are small/fragile and may collapse under tube vacuum","The patient has great veins","You need blood cultures only","You want to draw faster"],e:"With a syringe you control the pull. Transfer to tubes with a transfer device in the order of draw."},
 // Site / procedure

const KEY = "phleb-practice-v1";
let S = load();
function load(){
  try{ return Object.assign({cats:{}, missed:[], quizzes:0, best:{}, games:0, known:[]}, JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch(e){ return {cats:{}, missed:[], quizzes:0, best:{}, games:0, known:[]}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function record(cat, ok, qi){
  const c = S.cats[cat] || (S.cats[cat] = {r:0,t:0});
  c.t++; if(ok) c.r++;
  if(qi>=0){
    if(!ok && !S.missed.includes(qi)) S.missed.push(qi);
    if(ok) S.missed = S.missed.filter(x=>x!==qi);
  }
  save();
}

/* ---------- Order of Draw game ---------- */
let OG = {};
function orderGame(mode){
  mode = mode || OG.mode || "basic";
  const ids = mode==="basic" ? BASIC_ORDER : FULL_ORDER;
  OG = {mode, ids, picked:[], mistakes:0, start:Date.now()};
  renderOrder();
}
function renderOrder(){
  const {mode, ids, picked} = OG;
  const done = picked.length===ids.length;
  if(!OG.bank) OG.bank = shuffle(ids);
  if(OG.bank.length!==ids.length || !ids.every(i=>OG.bank.includes(i))) OG.bank = shuffle(ids);
  app.innerHTML = `${back("practice","Practice")}
  <h2>🧪 Order of Draw Game</h2>
  <div class="chips">
    <button class="chip ${mode==='basic'?'on':''}" onclick="OG.bank=null;orderGame('basic')">Basic (7 tubes)</button>
    <button class="chip ${mode==='full'?'on':''}" onclick="OG.bank=null;orderGame('full')">Advanced (11 tubes)</button>
  </div>
  <p class="small muted">Tap the tubes in the correct venipuncture order. Tubes in the same group (like red & gold, or lavender/pink/royal/tan) can go in either order.</p>
  <div class="slots">${ids.map((_,i)=>picked[i]?`<div class="slot">${tube(picked[i])}<span>${i+1}</span></div>`:`<div class="slot"><div class="ph"></div><span>${i+1}</span></div>`).join("")}</div>
  ${done?`<div class="feedback ${OG.mistakes?'no':'ok'}" style="margin-top:12px">
      <b>${OG.mistakes?'Done!':'Perfect! 🎉'}</b> ${OG.mistakes} mistake${OG.mistakes===1?'':'s'} · ${Math.round((Date.now()-OG.start)/1000)} sec
      <div class="small" style="margin-top:6px">${ids.map(i=>TUBES[i].short).join(" → ")}</div></div>
    <button class="btn full" style="margin-top:12px" onclick="OG.bank=null;orderGame()">Play again</button>`
  :`<div class="bank">${OG.bank.map(id=>`<button class="tbtn ${picked.includes(id)?'used':''}" id="tb-${id}" onclick="pickTube('${id}')">${tube(id,false,false)}${TUBES[id].short}</button>`).join("")}</div>
    <p class="small muted" style="text-align:center">Mistakes: ${OG.mistakes}</p>`}`;
}
function pickTube(id){
  const remaining = OG.ids.filter(i=>!OG.picked.includes(i));
  const minRank = Math.min(...remaining.map(i=>TUBES[i].rank));
  if(TUBES[id].rank===minRank){
    OG.picked.push(id);
    if(OG.picked.length===OG.ids.length){ S.games++; save(); }
    renderOrder();
  } else {
    OG.mistakes++;
    const el = document.getElementById("tb-"+id);
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    const hint = remaining.filter(i=>TUBES[i].rank===minRank).map(i=>TUBES[i].short).join(" or ");
    toast(`Not yet! Next should be: ${hint}`);
    document.querySelector(".bank+p").textContent = `Mistakes: ${OG.mistakes}`;
  }
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%;text-align:center;transition:opacity .3s";
    document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0,1800);
}

/* ---------- Requisition scenario drill ---------- */
let SC = {};
function scenarioGame(){
  const s = SCENARIOS[Math.random()*SCENARIOS.length|0];
  const distract = shuffle(FULL_ORDER.filter(i=>!s.need.includes(i))).slice(0,3);
  SC = {s, bank:shuffle([...s.need,...distract]), picked:[], mistakes:0};
  renderScenario();
}
function renderScenario(){
  const {s,bank,picked} = SC;
  const done = picked.length===s.need.length;
  app.innerHTML = `${back("practice","Practice")}
  <h2>📋 Requisition Drill</h2>
  <div class="card"><b>${s.q}</b><p class="small muted">Tap ONLY the tubes you need, in the correct order of draw.</p></div>
  <div class="slots">${s.need.map((_,i)=>picked[i]?`<div class="slot">${tube(picked[i])}<span>${TUBES[picked[i]].short}</span></div>`:`<div class="slot"><div class="ph">?</div></div>`).join("")}</div>
  ${done?`<div class="feedback ${SC.mistakes?'no':'ok'}" style="margin-top:12px"><b>${SC.mistakes?'Completed':'Perfect! 🎉'}</b> — ${SC.mistakes} mistake${SC.mistakes===1?'':'s'}
     <div class="small" style="margin-top:6px">${s.need.map(i=>TUBES[i].short).join(" → ")}</div></div>
     <button class="btn full" style="margin-top:12px" onclick="scenarioGame()">Next requisition</button>`
   :`<div class="bank">${bank.map(id=>`<button class="tbtn ${picked.includes(id)?'used':''}" id="sc-${id}" onclick="pickSc('${id}')">${tube(id,false,false)}${TUBES[id].short}</button>`).join("")}</div>`}`;
}
function pickSc(id){
  const {s,picked} = SC;
  const remaining = s.need.filter(i=>!picked.includes(i));
  const minRank = Math.min(...remaining.map(i=>TUBES[i].rank));
  const el = document.getElementById("sc-"+id);
  if(!s.need.includes(id)){ SC.mistakes++; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); toast(`${TUBES[id].short} isn't needed for these tests.`); return; }
  if(TUBES[id].rank!==minRank){ SC.mistakes++; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); toast("Right tube, wrong order!"); return; }
  // keep slot order in "need" sequence for equal ranks
  picked.push(id); renderScenario();
}

/* ---------- Name that tube ---------- */
let TM = {score:0, n:0};
function tubeMatch(){
  const id = FULL_ORDER[Math.random()*FULL_ORDER.length|0];
  const askTest = Math.random()<.5;
  const opts = shuffle([id, ...shuffle(FULL_ORDER.filter(x=>TUBES[x].rank!==TUBES[id].rank)).slice(0,3)]);
  TM.cur = {id, askTest};
  const t = TUBES[id];
  const test = t.tests[Math.random()*t.tests.length|0];
  app.innerHTML = `${back("practice","Practice")}
  <h2>🎨 Name That Tube</h2>
  <p class="small muted">Score: ${TM.score}/${TM.n}</p>
  <div class="card" style="text-align:center">
    ${askTest?`<p class="muted small">Which tube is used for…</p><h2>${test}</h2>`
             :`<div style="display:flex;justify-content:center;margin:6px 0 10px">${tube(id,true)}</div><p class="muted small">What is this tube's additive?</p>`}
  </div>
  ${opts.map(o=>`<button class="opt" data-o="${o}" onclick="tmAnswer(this,'${o}')">${askTest?`<span style="display:inline-flex;vertical-align:middle;margin-right:10px">${tube(o,false,false)}</span>${TUBES[o].name}`:TUBES[o].additive}</button>`).join("")}
  <div id="tmfb"></div>`;
}
function tmAnswer(btn,o){
  const {id} = TM.cur; TM.n++;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.o===id) b.classList.add("right"); });
  const ok = o===id; if(ok) TM.score++; else btn.classList.add("wrong");
  record("Tubes & Additives", ok, -1);
  document.getElementById("tmfb").innerHTML = `<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Correct!':'Not quite.'}</b> ${TUBES[id].name}: ${TUBES[id].additive}. Used for ${TUBES[id].tests.join(", ")}.</div>
  <button class="btn full" style="margin-top:12px" onclick="tubeMatch()">Next →</button>`;
}

/* ---------- Procedure steps game ---------- */
let SG = {};
function stepsGame(){
  SG = {bank:shuffle(STEPS.map((s,i)=>i)), next:0, mistakes:0};
  renderSteps();
}
function renderSteps(){
  const done = SG.next===STEPS.length;
  app.innerHTML = `${back("practice","Practice")}
  <h2>🩹 Procedure Steps</h2>
  <p class="small muted">Tap the steps of a routine venipuncture in order. Step ${Math.min(SG.next+1,STEPS.length)} of ${STEPS.length} · Mistakes: ${SG.mistakes}</p>
  <div class="bar"><i style="width:${SG.next/STEPS.length*100}%"></i></div>
  ${done?`<div class="feedback ${SG.mistakes?'no':'ok'}"><b>${SG.mistakes?'Finished!':'Flawless! 🎉'}</b> ${SG.mistakes} mistake${SG.mistakes===1?'':'s'}.</div>
     <button class="btn full" style="margin-top:12px" onclick="stepsGame()">Try again</button>
     <div class="card" style="margin-top:14px"><ol class="small">${STEPS.map(s=>`<li>${s}</li>`).join("")}</ol></div>`
  : SG.bank.map(i=>`<button class="stepbtn ${i<SG.next?'done':''}" id="st-${i}" ${i<SG.next?'disabled':''} onclick="pickStep(${i})">${i<SG.next?`<b>${i+1}.</b> `:''}${STEPS[i]}</button>`).join("")}`;
}
function pickStep(i){
  if(i===SG.next){ SG.next++; renderSteps(); }
  else { SG.mistakes++; const el=document.getElementById("st-"+i); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    document.querySelector("p.small.muted").textContent = `Tap the steps of a routine venipuncture in order. Step ${SG.next+1} of ${STEPS.length} · Mistakes: ${SG.mistakes}`; }
}

/* ---------- Quiz ---------- */
let QZ = {};
let quizCats = new Set(CATS);
function quizSetup(){
  app.innerHTML = `${back("practice","Practice")}
  <h2>❓ Quiz by Topic</h2>
  <p class="small muted">Choose the topics you want to practice.</p>
  <div class="chips">${CATS.map((c,i)=>`<button class="chip ${quizCats.has(c)?'on':''}" onclick="toggleCat(${i})">${c} (${QUESTIONS.filter(q=>q.c===c).length})</button>`).join("")}</div>
  <div class="row" style="margin:8px 0 16px"><button class="chip" onclick="quizCats=new Set(CATS);quizSetup()">Select all</button><button class="chip" onclick="quizCats=new Set();quizSetup()">Clear</button></div>
  <p><b>How many questions?</b></p>
  <div class="chips">${[10,20,"All"].map(n=>`<button class="chip" onclick="startTopic('${n}')">${n}</button>`).join("")}</div>`;
}
function toggleCat(i){ const c=CATS[i]; quizCats.has(c)?quizCats.delete(c):quizCats.add(c); quizSetup(); }
function startTopic(n){
  let pool = QUESTIONS.map((q,i)=>i).filter(i=>quizCats.has(QUESTIONS[i].c));
  if(!pool.length){ toast("Pick at least one topic"); return; }
  pool = shuffle(pool); if(n!=="All") pool = pool.slice(0,+n);
  quizStart(pool, "Quiz");
}
function examSet(){ return shuffle(QUESTIONS.map((q,i)=>i)).slice(0,25); }
function quizStart(list, title, exam=false){
  QZ = {list:shuffle(list), i:0, right:0, title, exam, wrongs:[]};
  renderQ();
}
function renderQ(){
  if(QZ.i>=QZ.list.length) return quizEnd();
  const qi = QZ.list[QZ.i], q = QUESTIONS[qi];
  const opts = shuffle(q.a.map((t,k)=>({t,k})));
  app.innerHTML = `${back("practice","Quit")}
  <div class="row" style="justify-content:space-between"><b>${QZ.title}</b><span class="small muted">${QZ.i+1} / ${QZ.list.length}</span></div>
  <div class="bar"><i style="width:${QZ.i/QZ.list.length*100}%"></i></div>
  <span class="pill">${q.c}</span>
  <h3 style="font-size:19px">${q.q}</h3>
  ${opts.map(o=>`<button class="opt" data-k="${o.k}" onclick="answer(this,${o.k})">${o.t}</button>`).join("")}
  <div id="fb"></div>`;
}
function answer(btn,k){
  const qi = QZ.list[QZ.i], q = QUESTIONS[qi], ok = k===0;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.k==="0") b.classList.add("right"); });
  if(!ok){ btn.classList.add("wrong"); QZ.wrongs.push(qi); } else QZ.right++;
  record(q.c, ok, qi);
  document.getElementById("fb").innerHTML = `<div class="feedback ${ok?'ok':'no'}"><b>${ok?'✅ Correct!':'❌ Not quite.'}</b> ${q.e}</div>
  <button class="btn full" style="margin-top:12px" onclick="QZ.i++;renderQ();window.scrollTo(0,0)">${QZ.i+1<QZ.list.length?'Next →':'See results'}</button>`;
}
function quizEnd(){
  const pct = Math.round(QZ.right/QZ.list.length*100);
  S.quizzes++;
  if(QZ.exam){ S.best.exam = Math.max(S.best.exam||0, pct); }
  save();
  const pass = pct>=70;
  app.innerHTML = `<h2>${QZ.title} results</h2>
  <div class="card" style="text-align:center">
    <div class="stat" style="font-size:52px">${pct}%</div>
    <p>${QZ.right} of ${QZ.list.length} correct</p>
    <p>${pct>=90?'Outstanding! 🌟':pass?'Nice work — keep going! 💪':'Keep practicing — you\'re learning! 📚'}</p>
    ${QZ.exam?`<p class="small muted">Many certification exams require about 70% to pass. Best mock exam: ${S.best.exam}%</p>`:''}
  </div>
  ${QZ.wrongs.length?`<h3>Review what you missed</h3>${QZ.wrongs.map(i=>`<div class="card small"><b>${QUESTIONS[i].q}</b><p>✅ ${QUESTIONS[i].a[0]}</p><p class="muted">${QUESTIONS[i].e}</p></div>`).join("")}
    <button class="btn full" onclick="quizStart([...QZ.wrongs],'Retry Missed')">Retry the ${QZ.wrongs.length} I missed</button>`:''}
  <button class="btn alt full" style="margin-top:10px" onclick="go(practice)">Back to Practice</button>`;
}

/* ---------- Flashcards ---------- */
let FC = {};
function flashcards(onlyUnknown){
  let deck = FLASH.map((_,i)=>i);
  if(onlyUnknown) deck = deck.filter(i=>!S.known.includes(i));
  if(!deck.length){ toast("You know them all! Resetting deck."); S.known=[]; save(); deck = FLASH.map((_,i)=>i); }
  FC = {deck:shuffle(deck), i:0, onlyUnknown};
  renderFC();
}
function renderFC(){
  if(FC.i>=FC.deck.length){
    app.innerHTML = `${back("practice","Practice")}<h2>🃏 Deck finished!</h2>
    <div class="card"><p>You marked <b>${S.known.length}</b> of ${FLASH.length} cards as known.</p></div>
    <button class="btn full" onclick="flashcards(true)">Study cards I still need</button>
    <button class="btn alt full" style="margin-top:10px" onclick="flashcards()">Shuffle all cards</button>`;
    return;
  }
  const c = FLASH[FC.deck[FC.i]];
  app.innerHTML = `${back("practice","Practice")}
  <div class="row" style="justify-content:space-between"><b>🃏 Flashcards</b><span class="small muted">${FC.i+1} / ${FC.deck.length}</span></div>
  <div class="bar"><i style="width:${FC.i/FC.deck.length*100}%"></i></div>
  <div class="flash" id="fc" onclick="this.classList.toggle('flip')">
    <div class="in"><div class="f"><span class="lbl">Question · tap to flip</span>${c[0]}</div><div class="b"><span class="lbl">Answer</span>${c[1]}</div></div>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn alt" style="flex:1" onclick="fcMark(false)">😕 Still learning</button>
    <button class="btn" style="flex:1" onclick="fcMark(true)">😀 Got it</button>
  </div>
  <p class="small muted" style="text-align:center;margin-top:10px">Known: ${S.known.length} / ${FLASH.length}</p>`;
}
function fcMark(k){
  const id = FC.deck[FC.i];
  if(k && !S.known.includes(id)) S.known.push(id);
  if(!k) S.known = S.known.filter(x=>x!==id);
  save(); FC.i++; renderFC();
}

/* =========================================================
   PROGRESS
   ========================================================= */
function progress(){
  const rows = CATS.map(c=>{ const s=S.cats[c]||{r:0,t:0}; const p=s.t?Math.round(s.r/s.t*100):null; return {c,s,p}; });
  const weak = rows.filter(r=>r.p!==null && r.p<70).sort((a,b)=>a.p-b.p);
  app.innerHTML = `<h2>📊 Progress</h2>
  <div class="card"><div class="row" style="gap:24px">
    <div><div class="stat">${S.quizzes}</div><div class="small muted">quizzes</div></div>
    <div><div class="stat">${S.games}</div><div class="small muted">order games</div></div>
    <div><div class="stat">${S.best.exam!=null?S.best.exam+'%':'—'}</div><div class="small muted">best mock exam</div></div>
    <div><div class="stat">${S.known.length}/${FLASH.length}</div><div class="small muted">cards known</div></div>
  </div></div>
  <div class="card">
    <h3 style="margin-top:0">By topic</h3>
    ${rows.map(r=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span class="small">${r.c}</span><span class="small muted">${r.p===null?'not started':r.p+'% ('+r.s.r+'/'+r.s.t+')'}</span></div>
      <div class="bar" style="margin:4px 0"><i style="width:${r.p||0}%;background:${r.p===null?'var(--line)':r.p>=80?'var(--ok)':r.p>=60?'var(--warn)':'var(--bad)'}"></i></div></div>`).join("")}
  </div>
  ${weak.length?`<div class="tip"><b>Focus on:</b> ${weak.map(w=>w.c).join(", ")}</div>`:''}
  ${S.missed.length?`<button class="btn full" onclick="quizStart([...S.missed],'Review Missed')">🔁 Review ${S.missed.length} missed questions</button>`:''}
  <button class="btn alt full" style="margin-top:12px" onclick="if(confirm('Reset all progress?')){localStorage.removeItem(KEY);S=load();progress();}">Reset progress</button>`;
}

/* start */
setTab("home"); home();
</script>
