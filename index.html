<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d1e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1fb" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hidden Word">
  <meta name="description" content="Memorize Scripture with spaced repetition. Hide God's word in your heart.">
  <title>Hidden Word</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div class="grain"></div>
  </div>

  <main id="app">
    <section id="view-home" class="view active"></section>
    <section id="view-library" class="view"></section>
    <section id="view-profile" class="view"></section>
  </main>

  <nav class="tabbar glass" aria-label="Main">
    <button class="tab active" data-tab="home" aria-label="Today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.2-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.2 12C19 16.6 12 21 12 21z"/></svg>
      Today
    </button>
    <button class="tab" data-tab="library" aria-label="Library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M12 7v6M9 10h6"/></svg>
      Library
    </button>
    <button class="tab" data-tab="profile" aria-label="Progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8L3.5 9.2l5.9-.9z"/></svg>
      Progress
    </button>
  </nav>

  <div id="session" class="session hidden" role="dialog" aria-modal="true"></div>
  <div id="backdrop" class="backdrop"></div>
  <div id="sheet" class="sheet glass" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast glass"></div>
  <canvas id="fx"></canvas>
  <input type="file" id="import-file" accept="application/json" hidden>

  <script src="js/verses.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
