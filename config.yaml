# Price Glitch Scanner configuration
# API keys do NOT go here — put them in the .env file.

schedule:
  interval_minutes: 7        # how often to check (5–10 recommended)
  jitter_seconds: 30         # random extra delay so requests aren't perfectly regular

# Global detection rules. Any watchlist item can override these individually.
thresholds:
  drop_percent: 60           # alert if price is >= this % below the 30-day average
  history_days: 30           # window used for the "normal" (average) price
  min_history_samples: 3     # until we have this many saved prices, fall back to the
                             # retailer's own "regular price" as the baseline
  min_price: 10              # ignore anything cheaper than this (junk filter)
  ignore_refurbished: true   # skip refurbished / renewed / pre-owned items
  ignore_open_box: true      # skip open-box items
  realert_hours: 24          # don't re-alert the same product at the same price within this window

storage:
  database: prices.db
  record_every_minutes: 60   # save an unchanged price at most this often (changes are always saved)
  keep_days: 90              # delete price history older than this

logging:
  file: logs/scanner.log
  level: INFO                # use DEBUG to log every single product price on every check

notifications:
  ntfy:
    enabled: true
    server: https://ntfy.sh  # topic comes from NTFY_TOPIC in .env
    priority: 5              # 5 = max (loud), 3 = default
  discord:
    enabled: false           # webhook URL comes from DISCORD_WEBHOOK_URL in .env

# Polite request pacing per source (well under each API's published limits).
sources:
  bestbuy:
    requests_per_second: 2   # Best Buy allows 5/sec; we stay well under
  keepa:
    domain: 1                # 1 = amazon.com
    price_type: amazon       # "amazon" (sold by Amazon) or "new" (lowest new price, incl. 3rd-party sellers)
    requests_per_second: 1

# What to watch. Each entry needs exactly ONE of: sku / asin, keywords, category.
# Any threshold above (drop_percent, min_price, ...) can be overridden per item,
# and "alert_below" sets a manual "tell me if it ever goes under $X" price.
watchlist:
  bestbuy:
    - name: "Gaming laptops"
      keywords: "gaming laptop"
      max_pages: 2           # 100 products per page

    - name: "Laptops category"
      category: "abcat0502000"   # Best Buy category id (see README for how to find these)
      max_pages: 2

    # Example of a specific product with a manual alert price (replace with a real SKU):
    # - name: "Specific TV"
    #   sku: "1234567"
    #   alert_below: 299.99
    #   drop_percent: 40

  keepa:
    # Only used if KEEPA_API_KEY is set in .env. Replace with real ASINs.
    # - name: "Example Amazon item"
    #   asin: "B0XXXXXXXX"
    #   alert_below: 150
